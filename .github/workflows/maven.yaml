name: Maven Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
   workflow_dispatch:

jobs:
  build:
    runs-on: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install
        working-directory: JavaWebCalculator


